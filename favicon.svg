<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="myplanBYU">
  <!-- Matches the myplanBYU project card on the portfolio: the map-location
       glyph on .theme-myplan blue (#0a4bd4, portfolio-3d.css). Drawn rather
       than lifted from Font Awesome so it stays legible at 16px. -->
  <rect width="64" height="64" rx="19" fill="#0a4bd4"/>
  <!-- folded map -->
  <path d="M6 46 L21 41 L38 46 L58 41 L58 52 L38 57 L21 52 L6 57 Z" fill="#fff"/>
  <path d="M21 41 V52 M38 46 V57" stroke="#0a4bd4" stroke-width="1.8" fill="none"/>
  <!-- location pin -->
  <circle cx="32" cy="19" r="11" fill="#fff"/>
  <path d="M24.8 26 L39.2 26 L32 37 Z" fill="#fff"/>
  <circle cx="32" cy="19" r="4.3" fill="#0a4bd4"/>
</svg>
