<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>myplanBYU — solver tests</title>
<style>
  :root { color-scheme: dark; --bg:#0e1116; --panel:#161b22; --line:#2a323d;
          --fg:#e6edf3; --dim:#8b949e; --pass:#3fb950; --fail:#f85149;
          --warn:#d29922; --info:#58a6ff; --known:#a371f7; }
  * { box-sizing: border-box; }
  /* .totals sets display:flex, which outranks the UA stylesheet's [hidden]
     rule - without this the hidden panels still render */
  [hidden] { display: none !important; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--fg);
         font:14px/1.5 ui-monospace, "JetBrains Mono", "SF Mono", Consolas, monospace; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--dim); margin-bottom:18px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:18px; }
  button { background:var(--panel); color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:7px 13px; font:inherit; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--info); color:var(--info); }
  button:disabled { opacity:.5; cursor:default; }
  .totals { display:flex; gap:18px; flex-wrap:wrap; margin-bottom:14px; padding:12px 14px;
            background:var(--panel); border:1px solid var(--line); border-radius:8px; }
  .totals b { font-size:19px; display:block; }
  .pass{color:var(--pass)} .fail{color:var(--fail)} .warn{color:var(--warn)} .info{color:var(--info)} .dim{color:var(--dim)}
  .known{color:var(--known)}
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; color:var(--dim); font-weight:500; padding:6px 8px;
       border-bottom:1px solid var(--line); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
  td { padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr.case:hover { background:#1b2129; }
  tr.case { cursor:pointer; }
  .st { font-weight:700; }
  .det { display:none; background:#0b0e13; }
  .det.on { display:table-row; }
  .det pre { margin:0; padding:10px 14px; white-space:pre-wrap; word-break:break-word;
             font-size:12.5px; line-height:1.65; }
  .tag { display:inline-block; padding:1px 7px; border-radius:99px; font-size:11px;
         border:1px solid var(--line); color:var(--dim); margin-left:6px; }
  #empty { color:var(--dim); padding:26px 0; }
  .sym { border:1px solid var(--line); border-radius:8px; margin-bottom:12px; background:var(--panel); }
  .sym > summary { cursor:pointer; padding:11px 14px; display:flex; gap:10px; align-items:baseline;
                   flex-wrap:wrap; list-style:none; }
  .sym > summary::-webkit-details-marker { display:none; }
  .sym > summary:hover { background:#1b2129; }
  .sym .n { font-size:19px; font-weight:700; min-width:44px; }
  .sym .t { font-weight:600; }
  .sym .scope { color:var(--dim); font-size:12.5px; }
  .sym .why { padding:0 14px 12px 68px; color:var(--dim); font-size:12.5px; margin-top:-4px; }
  .sym ul { margin:0; padding:0 14px 14px 68px; list-style:none; }
  .sym li { padding:3px 0; font-size:12.5px; border-top:1px solid var(--line); }
  .sym li b { font-weight:600; }
  .sym li .d { color:var(--dim); }
  h2.sec { font-size:13px; text-transform:uppercase; letter-spacing:.07em; color:var(--dim);
           margin:22px 0 10px; font-weight:500; }
</style>
</head>
<body>

<h1>myplanBYU — solver tests</h1>
<div class="sub">Invariants + golden plans. Loads the same scripts <code>index.html</code> ships.</div>

<div class="bar">
  <button id="runCurated">Run curated cases</button>
  <button id="runSweep">Sweep all majors (invariants only)</button>
  <button id="runTax">Failure taxonomy</button>
  <button id="record">Record goldens</button>
  <span id="status" class="dim"></span>
</div>

<div class="totals" id="totals" hidden>
  <div><b id="tCases">0</b><span class="dim">cases</span></div>
  <div><b id="tPass" class="pass">0</b><span class="dim">passed</span></div>
  <div><b id="tFail" class="fail">0</b><span class="dim">failed</span></div>
  <div><b id="tKnown" class="known">0</b><span class="dim">known issues</span></div>
  <div><b id="tWarn" class="warn">0</b><span class="dim">warnings</span></div>
  <div><b id="tNone" class="info">0</b><span class="dim">no golden</span></div>
  <div><b id="tMs">0</b><span class="dim">ms</span></div>
</div>

<div class="totals" id="taxTotals" hidden>
  <div><b id="xCombos">0</b><span class="dim">combinations</span></div>
  <div><b id="xClean" class="pass">0</b><span class="dim">clean</span></div>
  <div><b id="xAffected" class="warn">0</b><span class="dim">with a symptom</span></div>
  <div><b id="xSymptoms" class="known">0</b><span class="dim">distinct symptoms</span></div>
  <div><b id="xMs">0</b><span class="dim">ms</span></div>
</div>

<div id="tax" hidden></div>

<div id="empty">Nothing run yet.</div>
<table id="tbl" hidden>
  <thead><tr><th style="width:42%">Case</th><th style="width:12%">Status</th>
  <th style="width:24%">Golden</th><th style="width:12%">Findings</th><th style="width:10%">Time</th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<script src="../js/catalog_data.js"></script>
<script src="../js/timeline_data.js"></script>
<script src="../js/data.js"></script>
<script src="../js/solver.js"></script>
<script src="goldens.js"></script>
<script src="cases.js"></script>
<script src="invariants.js"></script>
<script src="harness.js"></script>
<script src="taxonomy.js"></script>
<script>
"use strict";
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));

  const GOLD_LABEL = {
    match:      ['<span class="pass">unchanged</span>', ""],
    changed:    ['<span class="fail">plan changed</span>', ""],
    "score-only":['<span class="warn">score only</span>', ""],
    none:       ['<span class="info">not recorded</span>', ""],
    skip:       ['<span class="dim">—</span>', ""],
  };

  function render(report) {
    $("#empty").hidden = true;
    $("#taxTotals").hidden = true;
    $("#tax").hidden = true;
    $("#totals").hidden = false;
    $("#tbl").hidden = false;
    $("#tCases").textContent = report.totals.cases;
    $("#tPass").textContent  = report.totals.pass;
    $("#tFail").textContent  = report.totals.fail;
    $("#tKnown").textContent = report.totals.known;
    $("#tWarn").textContent  = report.totals.warn;
    $("#tNone").textContent  = report.totals.noGolden;
    $("#tMs").textContent    = report.ms;

    const rows = $("#rows");
    rows.innerHTML = "";
    report.cases.forEach((c, i) => {
      const fails = c.violations.filter(v => v.severity === "fail").length;
      const warns = c.violations.filter(v => v.severity === "warn").length;
      const knowns = c.violations.filter(v => v.severity === "known").length;
      const bits = [];
      if (fails) bits.push(`<span class="fail">${fails} fail</span>`);
      if (knowns) bits.push(`<span class="known">${knowns} known</span>`);
      if (warns) bits.push(`<span class="warn">${warns} warn</span>`);
      const tr = document.createElement("tr");
      tr.className = "case";
      tr.innerHTML = `
        <td>${esc(c.name)}<span class="tag">${esc(c.id)}</span></td>
        <td class="st ${c.ok ? (knowns ? "known" : "pass") : "fail"}">${c.ok ? (knowns ? "KNOWN" : "PASS") : "FAIL"}</td>
        <td>${(GOLD_LABEL[c.golden.status] || GOLD_LABEL.skip)[0]}</td>
        <td>${bits.join(" ") || '<span class="dim">clean</span>'}</td>
        <td class="dim">${c.ms} ms</td>`;
      const det = document.createElement("tr");
      det.className = "det";
      det.innerHTML = `<td colspan="5"><pre>${esc(detailText(c)) || "<em>nothing to report</em>"}</pre></td>`;
      tr.addEventListener("click", () => det.classList.toggle("on"));
      rows.append(tr, det);
      if (!c.ok && i < 6) det.classList.add("on");   // surface the first failures
    });
  }

  function detailText(c) {
    const L = [];
    if (c.crash) L.push("SOLVE CRASHED\n" + c.crash);
    const order = { fail: 0, known: 1, warn: 2, info: 3 };
    c.violations.slice().sort((a, b) => order[a.severity] - order[b.severity]).forEach(v => {
      L.push(`[${v.severity.toUpperCase()}] ${v.rule}: ${v.msg}` + (v.detail ? `\n         ${v.detail}` : ""));
    });
    if (c.knownNote) L.push("", "KNOWN ISSUE: " + c.knownNote);
    if (Array.isArray(c.golden.detail) && c.golden.detail.length) {
      L.push("");
      L.push(c.golden.status === "changed"
        ? `PLAN DIFF vs golden (score ${c.golden.scoreWas} -> ${c.golden.scoreNow}):`
        : "GOLDEN:");
      c.golden.detail.forEach(d => L.push("  " + d));
    }
    if (c.golden.status === "none") L.push("(no golden recorded for this case yet)");
    return L.join("\n");
  }

  function go(opts, label) {
    $("#status").textContent = `running ${label}…`;
    document.querySelectorAll("button").forEach(b => b.disabled = true);
    // yield so the status paints before the solver blocks the thread
    setTimeout(() => {
      const report = Harness.run(opts);
      render(report);
      $("#status").textContent =
        `${label}: ${report.totals.pass}/${report.totals.cases} passed in ${report.ms} ms`;
      document.querySelectorAll("button").forEach(b => b.disabled = false);
      window.TESTS = report;
    }, 30);
  }

  /* ---- failure taxonomy view ---------------------------------------- */
  function renderTax(sum) {
    $("#empty").hidden = true;
    $("#totals").hidden = true;
    $("#tbl").hidden = true;
    $("#taxTotals").hidden = false;
    $("#tax").hidden = false;
    $("#xCombos").textContent   = sum.combinations;
    $("#xClean").textContent    = sum.clean;
    $("#xAffected").textContent = sum.affected;
    $("#xSymptoms").textContent = sum.symptoms.length;
    $("#xMs").textContent       = sum.ms;

    const parts = ['<h2 class="sec">Symptoms, worst first</h2>'];
    sum.symptoms.forEach((s, i) => {
      parts.push(`<details class="sym"${i < 3 ? " open" : ""}>
        <summary>
          <span class="n ${s.weight >= 30 ? "fail" : s.weight >= 15 ? "warn" : "known"}">${s.count}</span>
          <span class="t">${esc(s.title)}</span>
          <span class="scope">across ${s.majors} major${s.majors === 1 ? "" : "s"}</span>
        </summary>
        <div class="why">${esc(s.why)}</div>
        <ul>${s.examples.map(e =>
          `<li><b>${esc(e.major)}</b> <span class="d">(${esc(e.state)})</span> &mdash; <span class="d">${esc(e.detail || "")}</span></li>`
        ).join("")}</ul>
      </details>`);
    });

    parts.push('<h2 class="sec">Worst individual combinations</h2>');
    parts.push('<table><thead><tr><th style="width:44%">Major</th><th style="width:18%">Student state</th>'
      + '<th style="width:10%">Score</th><th>Symptoms</th></tr></thead><tbody>'
      + sum.worst.map(w => `<tr><td>${esc(w.major)}</td><td class="dim">${esc(w.state)}</td>`
        + `<td class="fail">${w.score}</td><td class="dim">${esc(w.symptoms.join(", "))}</td></tr>`).join("")
      + "</tbody></table>");

    $("#tax").innerHTML = parts.join("");
  }

  function goTax() {
    $("#status").textContent = "building matrix...";
    document.querySelectorAll("button").forEach(b => b.disabled = true);
    setTimeout(() => {
      Taxonomy.runAsync({}, (done, total) => {
        $("#status").textContent = `solving ${done}/${total} combinations...`;
      }).then(sum => {
        renderTax(sum);
        $("#status").textContent =
          `taxonomy: ${sum.affected}/${sum.combinations} combinations have a symptom (${sum.ms} ms)`;
        document.querySelectorAll("button").forEach(b => b.disabled = false);
        window.TAXONOMY = sum;
      });
    }, 30);
  }

  $("#runCurated").addEventListener("click", () => go({ mode: "curated" }, "curated cases"));
  $("#runSweep").addEventListener("click", () => go({ mode: "sweep" }, "all majors"));
  $("#runTax").addEventListener("click", goTax);

  $("#record").addEventListener("click", () => {
    if (!Harness.report.cases.length) { $("#status").textContent = "run the curated cases first"; return; }
    if (Harness.report.mode === "sweep") { $("#status").textContent = "goldens are recorded from curated cases, not the sweep"; return; }
    const blob = new Blob([Harness.goldenText()], { type: "text/javascript" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "goldens.js";
    a.click();
    URL.revokeObjectURL(a.href);
    $("#status").textContent = "goldens.js downloaded — move it into myplanBYU/tests/ to replace the old one";
  });

  // exposed for headless drivers (browser automation / future CI)
  window.runTests = go;

  /* ---- headless mode --------------------------------------------------
     tests/headless.ps1 loads this page in Edge with --dump-dom and reads
     #emit. The payload is base64 so that course names containing &, <, or
     quotes survive the round trip through serialized HTML untouched.
       ?run=curated|sweep  — which set to run
       &emit=goldens       — emit goldens.js source (curated only)
       &emit=report        — emit the JSON report (for a CI exit code)
     Works over file:// too: every script here is a <script src>, not a
     fetch, so no server is required. */
  const q = new URLSearchParams(location.search);
  if (q.get("run") === "taxonomy") {
    // synchronous on purpose: under --virtual-time-budget Edge will not wait
    // on a setTimeout-chunked loop, and --dump-dom would fire mid-run
    const sum = Taxonomy.runSync({ limitMajors: +q.get("limit") || 0 });
    renderTax(sum);
    emitPayload(JSON.stringify(sum));
    document.title = `DONE ${sum.affected}/${sum.combinations}`;
  } else if (q.get("run")) {
    const mode = q.get("run") === "sweep" ? "sweep" : "curated";
    const report = Harness.run({ mode });
    render(report);
    const emit = q.get("emit") === "goldens" && mode === "curated"
      ? Harness.goldenText()
      : JSON.stringify({
          mode, ms: report.ms, totals: report.totals,
          cases: report.cases.map(c => ({
            id: c.id, name: c.name, ok: c.ok, ms: c.ms, crash: c.crash,
            golden: c.golden.status, goldenDiff: c.golden.detail || null,
            violations: c.violations, knownNote: c.knownNote || null,
          })),
        });
    emitPayload(emit);
    document.title = `DONE ${report.totals.pass}/${report.totals.cases}`;
  }

  function emitPayload(text) {
    const pre = document.createElement("pre");
    pre.id = "emit";
    pre.hidden = true;
    // btoa is latin1-only; encode UTF-8 first (course names carry — and é).
    // Chunked: spreading a 36 KB byte array into fromCharCode blows the stack.
    const bytes = new TextEncoder().encode(text);
    let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    pre.textContent = btoa(bin);
    document.body.appendChild(pre);
  }
})();
</script>
</body>
</html>
